<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeafCare – Model Test</title>
<style>
  :root {
    --bg: #0f1a14; --card: #17261d; --border: #2c4636; --text: #e6efe9;
    --muted: #9bb3a4; --green: #4caf50; --danger: #ef5350; --warn: #ffb74d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { color: #81c784; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  label { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
                     background: #0f1a14; color: var(--text); font-size: 15px; }
  .drop { border: 2px dashed var(--green); border-radius: 12px; padding: 26px; text-align: center;
          cursor: pointer; margin: 16px 0; }
  .drop:hover { background: #1c3225; }
  .drop small { color: var(--muted); }
  #preview { max-width: 100%; max-height: 280px; border-radius: 10px; display: none; margin: 0 auto 14px; }
  button { background: #388e3c; color: #fff; border: 0; border-radius: 9px; padding: 12px 24px;
           font-size: 16px; cursor: pointer; }
  button:disabled { background: #4a5a50; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .ok { background: #1b5e20; color: #c8e6c9; }
  .bad { background: #7f2a2a; color: #ffcdd2; }
  .unsure { background: #5d4a1a; color: #ffe0a3; }
  h2 { margin: 0 0 8px; font-size: 22px; }
  ul { padding-left: 20px; margin: 8px 0 0; }
  li { margin-bottom: 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .error { color: var(--danger); }
  details { margin-top: 12px; }
  pre { background: #0b130e; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>🌿 Model Test Page</h1>
  <p class="sub">Checks whether the model can name the plant and describe the symptoms by itself. Nothing here uses diseases.js.</p>

  <div class="card">
    <label for="model">Ollama model (change it to compare models)</label>
    <input type="text" id="model" value="qwen3-vl:4b-instruct" />

    <div class="drop" id="drop">
      📷 <strong>Click here to choose a leaf photo</strong><br />
      <small>JPG or PNG</small>
    </div>
    <input type="file" id="file" accept="image/png,image/jpeg" hidden />

    <img id="preview" alt="Selected leaf" />
    <div class="row">
      <button id="go" disabled>Identify &amp; describe</button>
      <span class="muted" id="status"></span>
    </div>
  </div>

  <div class="card" id="result" style="display:none"></div>
</main>

<script>
  // ---- Settings -----------------------------------------------------------
  const OLLAMA = 'http://localhost:11434'
  const MAX_SIDE = 768          // photo is shrunk to this before sending
  const TIMEOUT_MS = 5 * 60 * 1000

  // The model must answer in exactly this shape.
  const SCHEMA = {
    type: 'object',
    properties: {
      is_plant_leaf: { type: 'boolean' },
      leaf_features: { type: 'string' },
      plant_name: { type: 'string' },
      other_possibilities: { type: 'array', items: { type: 'string' } },
      looks_healthy: { type: 'boolean' },
      symptoms: { type: 'array', items: { type: 'string' } },
      confidence: { type: 'integer' },
    },
    required: ['is_plant_leaf', 'leaf_features', 'plant_name', 'other_possibilities', 'looks_healthy', 'symptoms', 'confidence'],
  }

  const PROMPT = `You are an experienced botanist and plant pathologist. Look carefully at this photo.
1. is_plant_leaf: does it show a plant leaf?
2. leaf_features: in one sentence describe the leaf SHAPE (lobed, oval, heart-shaped, serrated edge, compound...), vein pattern, size relative to the frame and surface texture.
3. plant_name: using those features, give the common name of the plant. You MUST give your single best guess, like "Grape", "Apple", "Tomato" or "Rose". Never answer "Unknown", "Not sure" or leave it empty.
4. other_possibilities: up to 2 other plants it could be, most likely first.
5. looks_healthy: does the leaf look healthy?
6. symptoms: list ONLY symptoms you can actually see (colour changes, spots with their colour/shape/size, edges, holes, curling, fuzz). 2 to 6 short points. Empty list if healthy.
7. confidence: 0 to 100 for the plant name.
Do not name a disease. Describe only what is visible.`

  // ---- Elements -----------------------------------------------------------
  const $ = (id) => document.getElementById(id)
  const fileInput = $('file'), preview = $('preview'), go = $('go'), statusEl = $('status'), resultEl = $('result')
  let chosenFile = null

  $('drop').onclick = () => fileInput.click()
  fileInput.onchange = () => {
    chosenFile = fileInput.files[0] || null
    if (!chosenFile) return
    preview.src = URL.createObjectURL(chosenFile)
    preview.style.display = 'block'
    go.disabled = false
    resultEl.style.display = 'none'
  }

  // ---- Helpers ------------------------------------------------------------
  async function toBase64(file) {
    const bmp = await createImageBitmap(file)
    const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height))
    const c = document.createElement('canvas')
    c.width = Math.round(bmp.width * scale)
    c.height = Math.round(bmp.height * scale)
    const ctx = c.getContext('2d')
    ctx.fillStyle = '#fff'
    ctx.fillRect(0, 0, c.width, c.height)
    ctx.drawImage(bmp, 0, 0, c.width, c.height)
    bmp.close()
    return c.toDataURL('image/jpeg', 0.9).split(',')[1]
  }

  async function gpuInfo(model) {
    try {
      const { models = [] } = await (await fetch(OLLAMA + '/api/ps')).json()
      const m = models.find((x) => x.name === model) || models[0]
      if (!m) return ''
      return Math.round((m.size_vram / m.size) * 100) + '% of the model is on the GPU'
    } catch { return '' }
  }

  function el(tag, text, cls) {
    const e = document.createElement(tag)
    if (text !== undefined) e.textContent = text   // textContent = safe, no HTML injection
    if (cls) e.className = cls
    return e
  }

  function showError(msg) {
    resultEl.replaceChildren(el('p', msg, 'error'))
    resultEl.style.display = 'block'
  }

  function showResult(r, seconds, gpu) {
    const box = resultEl
    box.replaceChildren()

    if (!r.is_plant_leaf) {
      box.append(el('h2', 'No plant leaf found'),
                 el('p', 'The model says this photo does not show a plant leaf. Try a close-up of one leaf.', 'muted'))
    } else {
      box.append(el('p', 'Plant identified', 'muted'), el('h2', r.plant_name || 'Unknown'))

      const health = el('span', r.looks_healthy ? 'Looks healthy' : 'Signs of a problem',
                        'pill ' + (r.looks_healthy ? 'ok' : 'bad'))
      const conf = el('span', 'Confidence (model’s own estimate): ' + r.confidence + '%',
                      'pill ' + (r.confidence >= 60 ? 'ok' : 'unsure'))
      const row = el('div', undefined, 'row')
      row.append(health, conf)
      box.append(row)

      if (r.other_possibilities && r.other_possibilities.length) {
        box.append(el('p', 'Could also be: ' + r.other_possibilities.join(', '), 'muted'))
      }

      box.append(el('h3', 'Visible symptoms'))
      if (r.symptoms && r.symptoms.length) {
        const ul = el('ul')
        r.symptoms.forEach((s) => ul.append(el('li', s)))
        box.append(ul)
      } else {
        box.append(el('p', 'None listed.', 'muted'))
      }
    }

    box.append(el('p', 'Took ' + seconds + ' s' + (gpu ? ' · ' + gpu : ''), 'muted'))

    const d = el('details')
    d.append(el('summary', 'Raw model answer'), el('pre', JSON.stringify(r, null, 2)))
    box.append(d)
    box.style.display = 'block'
  }

  // ---- Main ---------------------------------------------------------------
  go.onclick = async () => {
    if (!chosenFile) return
    const model = $('model').value.trim()
    go.disabled = true
    resultEl.style.display = 'none'

    const started = Date.now()
    const ticker = setInterval(() => {
      statusEl.textContent = 'Working… ' + Math.round((Date.now() - started) / 1000) + ' s (first run loads the model)'
    }, 500)

    const controller = new AbortController()
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS)

    try {
      const image = await toBase64(chosenFile)
      let res
      try {
        res = await fetch(OLLAMA + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            model, stream: false, format: SCHEMA, keep_alive: '10m',
            options: { temperature: 0.2, num_ctx: 4096 },
            messages: [{ role: 'user', content: PROMPT, images: [image] }],
          }),
        })
      } catch (e) {
        throw new Error(e.name === 'AbortError'
          ? 'Timed out. Run "ollama ps" and check whether the model is running on the CPU.'
          : 'Cannot reach Ollama. Is the Ollama app running? (Open this page through "npm run dev", not by double-clicking the file.)')
      }

      if (!res.ok) {
        if (res.status === 404) throw new Error('Model "' + model + '" is not installed. Run: ollama pull ' + model)
        const body = await res.json().catch(() => ({}))
        throw new Error(body.error || 'Ollama error ' + res.status)
      }

      const data = await res.json()
      let parsed
      try { parsed = JSON.parse(data.message.content) }
      catch { throw new Error('The model returned an unreadable answer: ' + (data.message.content || '(empty)')) }

      parsed.confidence = Math.max(0, Math.min(100, Number(parsed.confidence) || 0))
      showResult(parsed, ((Date.now() - started) / 1000).toFixed(1), await gpuInfo(model))
    } catch (err) {
      showError(err.message)
    } finally {
      clearInterval(ticker)
      clearTimeout(timer)
      statusEl.textContent = ''
      go.disabled = false
    }
  }
</script>
</body>
</html>
